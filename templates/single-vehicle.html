<!-- wp:group {"tagName":"main","className":"vehicle-detail"} -->
<main class="wp-block-group vehicle-detail">

	<!-- wp:group {"layout":{"type":"constrained","contentSize":"1320px"}} -->
	<div class="wp-block-group">

		<!-- wp:html -->
		<div class="vehicle-detail-grid">
			<div>
				<div class="vehicle-detail-gallery">[amarilla_vehicle_image]</div>
			</div>
			<div class="vehicle-detail-info">
				<div class="amarilla-eyebrow">[amarilla_vehicle_category]</div>
				<h1>[amarilla_vehicle_title]</h1>
				<p class="vehicle-detail-tagline">[amarilla_vehicle_tagline]</p>
				[amarilla_vehicle_specs_grid]
				<div class="vehicle-detail-content">[amarilla_vehicle_content]</div>
				<div class="vehicle-detail-cta">
					<h3>Líbí se vám tento vůz?</h3>
					<p>Napište nám termín a my připravíme cenovou nabídku na míru. Odpovídáme do hodiny.</p>
					[amarilla_vehicle_cta]
				</div>
			</div>
		</div>
		<!-- /wp:html -->

	</div>
	<!-- /wp:group -->

</main>
<!-- /wp:group -->
